<!DOCTYPE html>
<html>
<head>
    <title>Floorplan Solver</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 24px; }
        h2 { font-size: 18px; margin-top: 2rem; }
        input, select, button { padding: 6px 10px; font-size: 14px; margin: 4px; }
        .tag { display: inline-block; background: #eee; padding: 4px 10px; border-radius: 20px; margin: 4px; font-size: 13px; }
        .tag span { cursor: pointer; margin-left: 6px; color: #999; }
        .constraint-row { background: #f5f5f5; padding: 8px 12px; border-radius: 8px; margin: 4px 0; font-size: 13px; }
    </style>
</head>
<body>
    <h1>Floorplan Solver</h1>

    <h2>1. Add rooms</h2>
    <input type="text" id="room-input" placeholder="e.g. kitchen" />
    <button onclick="addRoom()">Add room</button>
    <label><input type="checkbox" id="exterior-check"> Needs exterior access</label>
    <div id="room-tags"></div>

    <h2>2. Add constraints</h2>
    <select id="c-room1"></select>
    <select id="c-type">
        <option value="must">must be adjacent to</option>
        <option value="must_not">must NOT be adjacent to</option>
    </select>
    <select id="c-room2"></select>
    <button onclick="addConstraint()">Add constraint</button>
    <div id="constraint-list"></div>

    <h2>3. Solve</h2>
    <button onclick="solve()">Solve</button>
    <button onclick="shuffle()">Shuffle</button>
    <div id="grid"></div>
    <div id="message"></div>

    <script>
        let rooms = [];
        let exteriorRooms = [];
        let constraints = [];

        function addRoom() {
            const input = document.getElementById("room-input");
            const name = input.value.trim();
            if (!name || rooms.includes(name)) return;
            
            const isExterior = document.getElementById("exterior-check").checked;
            rooms.push(name);
            if (isExterior) exteriorRooms.push(name);
            
            input.value = "";
            document.getElementById("exterior-check").checked = false;
            
            renderRooms();
            updateSelects();
        }

        function removeRoom(name) {
            rooms = rooms.filter(r => r !== name);
            exteriorRooms = exteriorRooms.filter(r => r !== name);
            constraints = constraints.filter(c => c[0] !== name && c[2] !== name);
            renderRooms();
            renderConstraints();
            updateSelects();
        }

        function renderRooms() {
            const div = document.getElementById("room-tags");
            div.innerHTML = rooms.map(r => 
                `<span class="tag">${r}${exteriorRooms.includes(r) ? " 🪟" : ""}<span onclick="removeRoom('${r}')">✕</span></span>`
            ).join("");
        }

        function updateSelects() {
            ["c-room1", "c-room2"].forEach(id => {
                const sel = document.getElementById(id);
                sel.innerHTML = rooms.map(r => `<option value="${r}">${r}</option>`).join("");
            });
        }

        function addConstraint() {
            const r1 = document.getElementById("c-room1").value;
            const r2 = document.getElementById("c-room2").value;
            const ctype = document.getElementById("c-type").value;
            if (r1 === r2) return;
            constraints.push([r1, ctype, r2]);
            renderConstraints();
        }

        function renderConstraints() {
            const div = document.getElementById("constraint-list");
            div.innerHTML = constraints.map((c, i) =>
                `<div class="constraint-row">${c[0]} <b>${c[1] === "must" ? "adjacent to" : "NOT adjacent to"}</b> ${c[2]}
                <span style="cursor:pointer;float:right" onclick="removeConstraint(${i})">✕</span></div>`
            ).join("");
        }

        function removeConstraint(i) {
            constraints.splice(i, 1);
            renderConstraints();
        }

        function solve() {
            fetch("/solve", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ rooms, constraints, exterior_rooms: exteriorRooms })
            })
            .then(r => r.json())
            .then(data => renderSolution(data));
        }

        function shuffle() { solve(); }

        function renderSolution(data) {
            const div = document.getElementById("grid");
            const msg = document.getElementById("message");
            if (!data.solution) {
                msg.textContent = "No solution found — try removing some constraints.";
                div.innerHTML = "";
                return;
            }
            msg.textContent = "";
            const COLS = data.cols;
            const ROWS = data.rows;
            let html = `<table style="border-collapse:collapse;margin-top:1rem">`;
            for (let r = 0; r < ROWS; r++) {
                html += "<tr>";
                for (let c = 0; c < COLS; c++) {
                    const cell = r * COLS + c;
                    const room = data.solution[cell] || "";
                    html += `<td style="border:1px solid #ccc;width:100px;height:60px;text-align:center;font-size:12px;background:${room ? '#d0e8ff' : '#fff'}">${room}</td>`;
                }
                html += "</tr>";
            }
            html += "</table>";
            div.innerHTML = html;
        }
    </script>
</body>
</html>
